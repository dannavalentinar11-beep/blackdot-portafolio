<!-- FICHA DE VIDEOJUEGO (BLACKDOT ARCADE) -->
<div class="modal sheet" id="game-sheet" hidden>
  <div class="modal-backdrop sheet-backdrop" data-close><img id="gs-bg" alt="" src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw=="></div>
  <section class="modal-panel sheet-panel" role="dialog" aria-modal="true" aria-labelledby="gs-title">
    <button class="modal-close sheet-close" type="button" data-close aria-label="Volver a la sala del arcade"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    <div class="sheet-grid">
      <div class="sheet-media">
        <figure class="sheet-shot">
          <img id="gs-img" alt="" width="1280" height="720" src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==">
          <figcaption><span class="badge-real">Captura real del juego</span><span id="gs-dim">3D</span></figcaption>
        </figure>
        <div class="sheet-thumbs" id="gs-thumbs" role="group" aria-label="Capturas"></div>
        <div class="sheet-tech"><p class="sheet-h">Tecnologías</p><div class="sheet-chips" id="gs-tech"></div></div>
      </div>
      <div class="sheet-body">
        <p class="kicker" id="gs-kicker">Estación 01 · Distrito urbano</p>
        <h2 class="sheet-title" id="gs-title">Juego</h2>
        <p class="sheet-genre" id="gs-genre"></p>
        <p class="sheet-desc" id="gs-desc"></p>
        <div class="sheet-actions">
          <button class="btn btn-arcade" type="button" id="gs-play"><svg class="ico" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12.5-7.5a1 1 0 0 0 0-1.72L8.5 3.64A1 1 0 0 0 7 4.5z"/></svg> Jugar ahora</button>
          <a class="btn btn-ghost btn-sm" id="gs-tab" href="#" target="_blank" rel="noopener">Abrir en pestaña nueva <span aria-hidden="true">↗</span></a>
        </div>
        <p class="sheet-h">Mecánicas principales</p>
        <ul class="sheet-mech" id="gs-mech"></ul>
        <p class="sheet-h">Controles</p>
        <ul class="sheet-ctrl" id="gs-ctrl"></ul>
        <p class="sheet-help" id="gs-help"></p>
        <div class="sheet-nav">
          <button class="btn btn-ghost btn-sm" type="button" data-close>← Volver al arcade</button>
          <span class="sheet-nav-r"><button class="hud-btn" type="button" id="gs-prev" aria-label="Juego anterior">←</button><button class="hud-btn" type="button" id="gs-next" aria-label="Juego siguiente">→</button></span>
        </div>
      </div>
    </div>
  </section>
</div>

<!-- REPRODUCTOR DE JUEGOS -->
<div class="player media-dark" id="player" hidden role="dialog" aria-modal="true" aria-labelledby="player-name">
  <div class="player-bar">
    <div class="player-title"><span class="sw" aria-hidden="true"></span><strong id="player-name">Juego</strong><small id="player-genre"></small></div>
    <button class="player-btn" type="button" id="pl-help" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="2" y="6" width="20" height="12" rx="3"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"/></svg><span class="lbl">Controles</span></button>
    <button class="player-btn" type="button" id="pl-reload"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg><span class="lbl">Reiniciar</span></button>
    <button class="player-btn" type="button" id="pl-full"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/></svg><span class="lbl">Pantalla completa</span></button>
    <button class="player-btn" type="button" id="pl-tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6M15 3h6v6M10 14 21 3"/></svg><span class="lbl">Nueva pestaña</span></button>
    <button class="player-btn close" type="button" id="pl-close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg><span class="lbl">Cerrar</span></button>
  </div>
  <div class="player-stage" id="player-stage">
    <div class="player-loader" id="player-loader"><div><div class="spin"></div><h3 id="pl-load-title">Cargando</h3><p id="pl-load-msg">Preparando el juego…</p><div class="bar"><i id="pl-load-bar"></i></div></div></div>
    <div class="player-help" id="player-help"><h4>Cómo jugar</h4><p id="pl-help-text"></p><ul id="pl-help-list"></ul></div>
  </div>
</div>
